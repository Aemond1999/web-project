<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google</title>
    <link href="css/base.css" rel="stylesheet" />
    <link href="css/google.css" rel="stylesheet" />
    <link href="css/google-iconfont.css" rel="stylesheet" />
  </head>
  <body>
    <div class="google-logo">
      <img src="uploads/google_logo.svg" />
    </div>

    <div class="google-search">
      <div class="search-img">
        <i class="iconfont icon-ic_search_48px"></i>
      </div>
      <input
        type="text"
        class="search-input"
        placeholder="在Google中搜素，或输入网址"
      />
      <div class="search-img">
        <i class="iconfont icon-ic_settings_voice_48px"></i>
      </div>
      <div class="search-img">
        <i class="iconfont icon-ic_photo_camera_48px"></i>
      </div>
    </div>

    <div class="shortcuts">
      <!-- 添加快捷方式按钮 -->
      <div class="add-shortcut">
        <div class="add-short-img">+</div>
        <div class="short-name">添加快捷方式</div>
      </div>

      <!-- 弹出框 -->
      <div class="pop-content">
        <div class="pop-title">添加快捷方式</div>
        <div class="pop-input">
          <p class="input-title">名称</p>
          <input type="text" class="web-name" name="web-name" />
          <p class="input-title">网址</p>
          <input type="text" class="web-url" name="web-url" />
        </div>
        <div class="pop-btns">
          <button id="pop-confirm" disabled>确认</button>
          <button id="pop-cancel">取消</button>
        </div>
      </div>
    </div>
  </body>
  <script>
    window.onload = () => {
      showShortCuts("shortcuts");
    };

    const popContent = document.querySelector(".pop-content");
    const addShortcut = document.querySelector(".add-shortcut");
    const body = document.querySelector("body");
    const webName = document.querySelector(".web-name");
    const webUrl = document.querySelector(".web-url");
    const popCancel = document.querySelector("#pop-cancel");
    const popConfirm = document.querySelector("#pop-confirm");
    const shortCuts = document.querySelector(".shortcuts");
    const shortcutItems = document.querySelectorAll("shortcut-item");

    document.querySelectorAll(".short");
    function Shortcut(name, url) {
      this.url = url;
      this.name = name;
    }

    function getFavicon(domain) {
      return `https://api.vwood.xyz/v1/Favicon/public?domain=${domain}`;
    }

    addShortcut.addEventListener("click", () => {
      popContent.classList.toggle("pop-active");
      body.classList.toggle("body-active");
      webName.focus();
    });

    popCancel.addEventListener("click", () => {
      popContent.classList.toggle("pop-active");
      body.classList.toggle("body-active");
    });

    webUrl.addEventListener("input", () => {
      if (webUrl.value.length > 0) {
        popConfirm.disabled = false;
        popConfirm.classList.add("pop-confirm-active");
      } else {
        popConfirm.disabled = true;
        popConfirm.classList.remove("pop-confirm-active");
      }
    });

    popConfirm.addEventListener("click", () => {
    
      let shortcut = new Array();
      let shortcutsIist = localStorage.getItem("shortcuts");
      if (shortcutsIist === null) {
        shortcut.push(new Shortcut(webName.value, getFavicon(webUrl.value)));
        localStorage.setItem("shortcuts", JSON.stringify(shortcut));
      } else {
        shortcutsIist = JSON.parse(shortcutsIist);
        shortcutsIist.push(
          new Shortcut(webName.value, getFavicon(webUrl.value))
        );
        localStorage.setItem("shortcuts", JSON.stringify(shortcutsIist));
      }
      showShortCuts("shortcuts");
      popContent.classList.toggle("pop-active");
      body.classList.toggle("body-active");
      webUrl.value = "";
      webName.value = "";
    });

    function showShortCuts(key) {
      let shortcutsIist = localStorage.getItem(key);
      if (shortcutsIist !== null) {
        shortcutsIist = JSON.parse(shortcutsIist);
        for (item of shortcutsIist) {
          let url = new URL(item.url);
          let search=url.search
          let newElem = document.createElement("a");
          newElem.href="https://"+search.split("=")[1]
          newElem.innerHTML =`<div class="shortcut-item">
            <div class="short-img"><img src="${item.url}"></div>
            <div class="short-name">${item.name}</div>
            </div>`;
          shortCuts.insertBefore(newElem, addShortcut);
        }
      }
    }
  </script>
</html>
